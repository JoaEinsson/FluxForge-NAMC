name: Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate foundational files and Markdown links
        run: python3 .github/scripts/check_repository.py
